[project]
name = "candlestack"
# Not the running version and not bumped: releases are git tags (v0.2.0, ...), and the app
# reports APP_VERSION, which the deploy sets (docs/architecture.md). The app does not read it.
version = "0.1.0"
description = "CandleStack backend: API for experiments on financial time series"
requires-python = ">=3.13,<3.14"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "fastapi>=0.141.1",
    "granian>=2.8.3",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "orjson>=3.12.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "scalar-fastapi>=1.9.1",
    "sentry-sdk>=2.70.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.4",
]

[project.scripts]
candlestack-bt = "candlestack.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "granian[reload]>=2.8.3",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "ty==0.0.84",
]
# What only the worker runs models with (candlestack.worker): Keras on the JAX backend. Keras is
# pinned to the release the upload's allowlist was generated from (ml/allowlist.py); a new one
# comes with the allowlist regenerated. The API image installs neither (backend/Dockerfile).
worker = [
    "jax>=0.11.2",
    "keras==3.15.1",
]

# The uv release line of the whole toolchain: local, CI (setup-uv reads this) and the image.
[tool.uv]
required-version = ">=0.12.19,<0.13"
# `uv sync` installs the worker's group too, so its tests and types run everywhere; the images
# choose their groups themselves.
default-groups = ["dev", "worker"]

# Migrations of the Postgres schema (backend/migrations), run by `alembic upgrade head`: by the
# migrate service of compose before the backend starts, and here against DATABASE_URL. A new one:
# `uv run alembic revision --autogenerate -m "<what changes>"`, then read and fix what it wrote.
[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s"
# The app is installed (uv) or on PYTHONPATH (the image): nothing to add to sys.path.
prepend_sys_path = []

# A new migration comes out linted and formatted.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT",
    "A", "ANN", "ARG", "BLE", "C4", "C90", "DTZ", "ERA", "FAST", "FBT", "FLY", "FURB", "G",
    "ICN", "INT", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PTH", "Q", "RET", "RSE",
    "S", "SLF", "SLOT", "T20", "TC", "TID",
    "D",
]
ignore = [
    "ANN401",     # Any is sometimes the honest type (JSON, **kwargs); ty checks the rest
    "PLR2004",    # HTTP status codes and small literals read better inline
    "S101",       # assert narrows types for ty
    "N818",       # exception names describe the problem (InstrumentNotFound)
    "ISC001",     # conflicts with ruff format
    # Docstrings are optional (Google style when written): only their format is checked.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # A summary may wrap onto a second line and the closing quotes may end the last line:
    # the style of the existing docstrings, which these two would rewrite for no reader's gain.
    "D205", "D209",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 5
max-branches = 8
max-statements = 30
max-returns = 6

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests: fixtures and fakes need no annotations or docstrings, and may take what they ignore.
"tests/**" = ["ANN", "ARG", "FBT", "PLR0913", "PLR0917", "PLR0915", "S", "SLF001", "D"]
# The e2e stand-in for Binance and Alpaca reports on stdout.
"tests/e2e/mock_sources.py" = ["T201"]

[tool.ty.src]
# Build the Keras test files and the allowlist in a container with Keras (their docstrings); the
# backend has none.
exclude = ["tests/fixtures/keras/*.py"]

[tool.ty.rules]
# On top of ty's defaults: generics spell out their type arguments, and an overriding method
# says so (typing.override), so renaming the base method breaks the check, not the behaviour.
missing-type-argument = "error"
missing-override-decorator = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs the unit tests; CI selects the other suites with -m, never the slow ones.
# No test opens a network socket (pytest-socket) unless it is an integration or e2e test
# (tests/conftest.py).
addopts = [
    "-m", "not integration and not e2e and not slow",
    "--strict-markers",
    "--import-mode=importlib",
    "-ra",
    "--disable-socket",
    "--allow-unix-socket",
]
markers = [
    "integration: needs a real Redis at REDIS_URL and a real Postgres at DATABASE_URL",
    "e2e: runs the built image with docker compose (tests/e2e/compose.yaml)",
    "slow: speed and memory checks, run by hand with -m slow",
]
filterwarnings = ["error"]
xfail_strict = true

# The gate is for the unit and integration tests together (CI's integration job):
# `pytest --cov -m "not e2e and not slow"` with Redis and Postgres running.
[tool.coverage.run]
source = ["candlestack"]
branch = true
# SQLAlchemy's asyncio runs the database calls in greenlets: without this, the lines after them
# would count as not run.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "candlestack"
# Lets the contracts below name third-party packages (sentry_sdk).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modules depend downwards only: experiments -> ml -> accounts, data and jobs -> core"
type = "layers"
layers = [
    "candlestack.experiments",
    "candlestack.ml",
    "candlestack.accounts | candlestack.data | candlestack.jobs",
    "candlestack.core",
]

[[tool.importlinter.contracts]]
name = "Other modules import core only through its package root"
type = "protected"
protected_modules = ["candlestack.core.*"]
allowed_importers = ["candlestack.core"]

[[tool.importlinter.contracts]]
name = "Other modules import accounts only through its package root"
type = "protected"
protected_modules = ["candlestack.accounts.*"]
allowed_importers = ["candlestack.accounts"]

[[tool.importlinter.contracts]]
name = "Other modules import ml only through its package root"
type = "protected"
protected_modules = ["candlestack.ml.*"]
allowed_importers = ["candlestack.ml"]

[[tool.importlinter.contracts]]
name = "Other modules import experiments only through its package root"
type = "protected"
protected_modules = ["candlestack.experiments.*"]
allowed_importers = ["candlestack.experiments"]

[[tool.importlinter.contracts]]
name = "Other modules import data only through its package root"
type = "protected"
protected_modules = ["candlestack.data.*"]
allowed_importers = ["candlestack.data"]

[[tool.importlinter.contracts]]
name = "Other modules import engine only through its package root"
type = "protected"
protected_modules = ["candlestack.engine.*"]
allowed_importers = ["candlestack.engine"]

[[tool.importlinter.contracts]]
name = "Other modules import signals only through its package root"
type = "protected"
protected_modules = ["candlestack.signals.*"]
allowed_importers = ["candlestack.signals"]

[[tool.importlinter.contracts]]
name = "Other modules import metrics only through its package root"
type = "protected"
protected_modules = ["candlestack.metrics.*"]
allowed_importers = ["candlestack.metrics"]

[[tool.importlinter.contracts]]
name = "Other modules import preprocessing only through its package root"
type = "protected"
protected_modules = ["candlestack.preprocessing.*"]
allowed_importers = ["candlestack.preprocessing"]

[[tool.importlinter.contracts]]
name = "Other modules import jobs only through its package root"
type = "protected"
protected_modules = ["candlestack.jobs.*"]
allowed_importers = ["candlestack.jobs"]

[[tool.importlinter.contracts]]
name = "Only core uses the Sentry SDK"
type = "forbidden"
source_modules = [
    "candlestack.accounts", "candlestack.cli", "candlestack.data", "candlestack.experiments",
    "candlestack.jobs", "candlestack.main", "candlestack.ml", "candlestack.openapi",
    "candlestack.worker",
]
forbidden_modules = ["sentry_sdk"]
# They reach Sentry through core (logging, setup_sentry), never by importing it themselves.
allow_indirect_imports = true

# The backtest and the model's input are plain functions on Polars frames: no app, settings,
# Redis or outgoing HTTP (the worker runs preprocessing without network). The modules and
# libraries are named one by one: a new module of the project or a new server library goes into
# forbidden_modules.
[[tool.importlinter.contracts]]
name = "Engine, signals, metrics and preprocessing stand alone"
type = "forbidden"
source_modules = [
    "candlestack.engine", "candlestack.signals", "candlestack.metrics",
    "candlestack.preprocessing",
]
forbidden_modules = [
    "candlestack.accounts", "candlestack.core", "candlestack.data", "candlestack.cli",
    "candlestack.experiments", "candlestack.jobs", "candlestack.main", "candlestack.ml",
    "candlestack.openapi", "candlestack.worker", "fastapi", "starlette", "scalar_fastapi", "granian", "redis",
    "httpx", "sentry_sdk", "pydantic_settings", "sqlalchemy", "asyncpg", "alembic", "authlib",
]

[[tool.importlinter.contracts]]
name = "Engine, signals, metrics and preprocessing do not know each other"
type = "independence"
modules = [
    "candlestack.engine", "candlestack.signals", "candlestack.metrics",
    "candlestack.preprocessing",
]

# The CLI wires signals, the engine and metrics together; it is an entry point, not a library.
# The modules are named one by one: a new module of the project goes into source_modules.
[[tool.importlinter.contracts]]
name = "Nothing imports the CLI"
type = "forbidden"
source_modules = [
    "candlestack.accounts", "candlestack.core", "candlestack.data", "candlestack.experiments",
    "candlestack.jobs", "candlestack.main", "candlestack.ml", "candlestack.openapi",
    "candlestack.preprocessing", "candlestack.worker",
]
forbidden_modules = ["candlestack.cli"]

# The worker is an entry point too (`python -m candlestack.worker`), a process of its own: the
# API reaches it through the job queue of `jobs`, never by importing it. The modules are named
# one by one: a new module of the project goes into source_modules.
[[tool.importlinter.contracts]]
name = "Nothing imports the worker"
type = "forbidden"
source_modules = [
    "candlestack.accounts", "candlestack.cli", "candlestack.core", "candlestack.data",
    "candlestack.engine", "candlestack.experiments", "candlestack.jobs", "candlestack.main",
    "candlestack.metrics", "candlestack.ml", "candlestack.openapi", "candlestack.preprocessing",
    "candlestack.signals",
]
forbidden_modules = ["candlestack.worker"]

# Inside data, each layer imports only the ones below it. Modules of one layer joined by "|"
# do not import each other; the ones joined by ":" may.
[[tool.importlinter.contracts]]
name = "Inside data: HTTP -> service -> stores and sources -> pure logic -> models"
type = "layers"
containers = ["candlestack.data"]
layers = [
    "api",
    "service",
    "catalog_store | firsts | icons | spark_store",
    "stats_store",
    "sources",
    "cache | candles | catalog | schemas",
    "sessions",
    "models : errors",
]

# Inside accounts, the same: routes, then what other modules' routes depend on (the signed-in
# user), the service and the cookies, the stores and the providers, the tables and bodies.
[[tool.importlinter.contracts]]
name = "Inside accounts: HTTP -> dependencies -> service -> stores and providers -> models"
type = "layers"
containers = ["candlestack.accounts"]
layers = [
    "api",
    "dependencies",
    "service | cookies",
    "store | pending | oauth",
    "models | errors | schemas",
]

# Inside ml, the same: routes, their dependencies, the service, then the queries, the file
# storage, the upload locks and the runner of the upload check, the check itself (which runs in
# a child process with the allowlist alone), then the table, the errors, the allowlist and what
# the backtests' usage of a model looks like, and the bodies at the bottom.
[[tool.importlinter.contracts]]
name = "Inside ml: HTTP -> dependencies -> service -> store, storage and check -> models"
type = "layers"
containers = ["candlestack.ml"]
layers = [
    "api",
    "dependencies",
    "service",
    "store | storage | uploads | sandbox",
    "inspect",
    "models | errors | allowlist | usage",
    "schemas",
]

# Inside experiments, the same: routes, the seed command and the result document's JSON
# Schema, the routes' dependencies, the services (the list, and starting a backtest and building
# its document), the runner of the backtests, the queries and the assembly of a run (signals,
# engine, metrics), then the table, the errors and what a run stores, the result document, and
# the bodies at the bottom.
[[tool.importlinter.contracts]]
name = "Inside experiments: HTTP and seed -> dependencies -> service -> store -> models"
type = "layers"
containers = ["candlestack.experiments"]
layers = [
    "api | seed | json_schema",
    "dependencies",
    "service | runs",
    "runner",
    "store | assembly",
    "models | errors | spec",
    "document",
    "schemas",
]

# The API checks an uploaded model by reading its file, never by loading it: a load could run
# code from the file, and the API image has no Keras or TensorFlow (the worker has).
# Preprocessing serves the catalog in the API and builds the input in the worker, so it builds
# arrays for a model without knowing the framework that runs it. The API hands models to the
# worker through jobs, which knows no framework either.
[[tool.importlinter.contracts]]
name = "The API never imports a deep learning framework"
type = "forbidden"
source_modules = [
    "candlestack.experiments", "candlestack.jobs", "candlestack.ml", "candlestack.main",
    "candlestack.preprocessing",
]
forbidden_modules = ["keras", "tensorflow", "torch", "jax"]

# The worker's own process takes jobs from the queue and runs each in a child process
# (worker.runner), the only one that imports Keras: the loop stays small and outlives a model
# that crashes, hangs or exhausts its memory.
[[tool.importlinter.contracts]]
name = "The worker's loop never imports a deep learning framework"
type = "forbidden"
source_modules = ["candlestack.worker.service"]
forbidden_modules = [
    "keras", "tensorflow", "torch", "jax", "candlestack.worker.model", "candlestack.worker.runner",
]

# What the sources share lives in sources.base.
[[tool.importlinter.contracts]]
name = "Sources do not know each other"
type = "independence"
modules = ["candlestack.data.sources.alpaca", "candlestack.data.sources.binance"]
