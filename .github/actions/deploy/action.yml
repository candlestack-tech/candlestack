name: Deploy to the VM
description: >-
  Runs one infra/vm/candlestack-deploy command on the VM over SSH through the Cloudflare
  Tunnel, then optionally waits until a health URL reports the expected value.

inputs:
  command:
    description: >-
      candlestack-deploy command, e.g.
      "up stage <version> <backend@digest> <frontend@digest> <worker@digest>"
    required: true
  ssh-key:
    description: Private deploy key of the environment (DEPLOY_SSH_KEY)
    required: true
  known-hosts:
    description: known_hosts line for ssh.candlestack.tech (DEPLOY_KNOWN_HOSTS)
    required: true
  access-client-id:
    description: Cloudflare Access service token id, if the SSH hostname is behind Access
    required: false
  access-client-secret:
    description: Cloudflare Access service token secret
    required: false
  ghcr-token:
    description: Token the VM uses once to pull the images (sent on stdin, not stored)
    required: false
  env-secrets:
    description: >-
      Secrets of the environment as KEY=VALUE lines, sent on stdin after the GHCR token and
      never printed (candlestack-deploy accepts only ALPACA_KEY_ID, ALPACA_SECRET_KEY,
      LOGO_DEV_KEY, SENTRY_DSN, POSTGRES_PASSWORD, the OAUTH_ keys and BETA_ALLOWLIST)
    required: false
  health-url:
    description: URL to poll after the command
    required: false
  health-expect:
    description: Text the health response must contain
    required: false

outputs:
  images:
    description: >-
      The images an "up" command started, "<backend@digest> <frontend@digest>" followed by
      "<worker@digest>" when it started the worker (stage); for "up prod", the ones the VM chose
      from its stage record; empty for other commands
    value: ${{ steps.run.outputs.images }}

runs:
  using: composite
  steps:
    # Pinned and checked against its SHA-256: this job holds the deploy key and the secrets.
    # To update, take a release of github.com/cloudflare/cloudflared and the sha256 digest that
    # GitHub lists for its cloudflared-linux-amd64.deb. Later deploy steps of a job reuse it.
    - name: Install cloudflared
      shell: bash
      env:
        VERSION: 2026.9.3
        SHA256: bc073ef293d504cf5ac533bd0aa1c824ef6b4f358765ccaa6628a8a95cacb4b7
      run: |
        if [[ $(cloudflared --version 2>/dev/null) == *"version $VERSION "* ]]; then
          exit 0
        fi
        deb=$RUNNER_TEMP/cloudflared.deb
        curl -fsSL -o "$deb" \
          "https://github.com/cloudflare/cloudflared/releases/download/$VERSION/cloudflared-linux-amd64.deb"
        echo "$SHA256  $deb" | sha256sum --check --quiet
        sudo dpkg -i "$deb" >/dev/null

    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
        chmod 600 ~/.ssh/deploy
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        # A connection that cannot be made or goes silent fails within a minute or two,
        # instead of holding the job and the deploy queue behind it.
        cat > ~/.ssh/config <<'EOF'
        Host candlestack
          HostName ssh.candlestack.tech
          User deploy
          IdentityFile ~/.ssh/deploy
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          ProxyCommand cloudflared access ssh --hostname %h
          ConnectTimeout 30
          ServerAliveInterval 15
          ServerAliveCountMax 4
        EOF

    - name: Run ${{ inputs.command }}
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        ENV_SECRETS: ${{ inputs.env-secrets }}
        TUNNEL_SERVICE_TOKEN_ID: ${{ inputs.access-client-id }}
        TUNNEL_SERVICE_TOKEN_SECRET: ${{ inputs.access-client-secret }}
      run: |
        # stdin of the command: the GHCR token on the first line, then the secrets.
        {
          printf '%s\n' "$GHCR_TOKEN"
          if [[ -n $ENV_SECRETS ]]; then
            printf '%s\n' "$ENV_SECRETS"
          fi
        } | ssh candlestack "$COMMAND" | tee "$RUNNER_TEMP/deploy-output"
        # "up" ends with "images <backend@digest> <frontend@digest> [<worker@digest>]".
        sed -n 's/^images /images=/p' "$RUNNER_TEMP/deploy-output" >>"$GITHUB_OUTPUT"

    - name: Wait until healthy
      if: inputs.health-url != ''
      shell: bash
      env:
        URL: ${{ inputs.health-url }}
        EXPECT: ${{ inputs.health-expect }}
        ACCESS_ID: ${{ inputs.access-client-id }}
        ACCESS_SECRET: ${{ inputs.access-client-secret }}
      run: |
        # stage sits behind Cloudflare Access; the service token lets this check in.
        auth=()
        if [[ -n $ACCESS_ID ]]; then
          auth=(-H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET")
        fi
        response=$RUNNER_TEMP/health
        for _ in $(seq 1 30); do
          rm -f "$response"
          status=$(curl -sS --max-time 5 "${auth[@]}" -o "$response" -w '%{http_code}' "$URL" || true)
          body=$(cat "$response" 2>/dev/null || true)
          if [[ $status == 2* && $body == *"$EXPECT"* ]]; then
            echo "$body"
            exit 0
          fi
          sleep 2
        done
        echo "::error::$URL did not report '$EXPECT' (last response: HTTP ${status:-none} ${body:0:300})"
        exit 1
