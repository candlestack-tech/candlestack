name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A new push to a pull request cancels its running CI; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No AI attribution in commits or the pull request. A required check of its own, which the
  # other jobs do not wait for: editing the pull request's title or description re-runs only
  # this check (no-ai-signs-edited.yml), so the rest must already have run.
  no-ai-signs:
    uses: candlestack-tech/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  # The description closes an issue ("Closes #N"). Required and independent like no-ai-signs:
  # editing the description re-runs only this check (linked-issue-edited.yml).
  linked-issue:
    if: github.event_name == 'pull_request'
    uses: candlestack-tech/.github/.github/workflows/linked-issue.yml@main

  # The title and branch follow the conventions; a warning when the pull request is large.
  # Required and independent like no-ai-signs: editing the title re-runs only this check
  # (pr-hygiene-edited.yml), so `ci` does not wait for it.
  pr-hygiene:
    if: github.event_name == 'pull_request'
    uses: candlestack-tech/.github/.github/workflows/pr-hygiene.yml@main
    permissions:
      pull-requests: read

  # The pre-commit hooks (.pre-commit-config.yaml) on every file: formatting, secrets, typos,
  # comments, Markdown, shfmt and shellcheck on every shell script, hadolint on the Dockerfiles,
  # and actionlint and zizmor on the workflows. On every run, whatever changed: they take about
  # a minute. ruff is left to `lint` and `infra`, which run it with the locked release.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format

  # Decides which suites run: each only when something it checks changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      infra: ${{ steps.diff.outputs.infra }}
      frontend: ${{ steps.diff.outputs.frontend }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit: the first parent is the base.
          if [[ $EVENT == pull_request ]]; then
            base=HEAD^1
          else
            base=$BEFORE
          fi
          if [[ $base =~ ^0*$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base ($base): running everything."
            changed=$'backend/\ninfra/\nfrontend/'
          else
            changed=$(git diff --name-only "$base" HEAD)
          fi
          backend=false
          infra=false
          frontend=false
          api=false
          if grep -qE '^(backend/|docs/openapi\.json$|compose[^/]*\.yaml$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            backend=true
          fi
          # backend/uv.lock: the server agent is linted with the backend's ruff release.
          if grep -qE '^(infra/|frontend/|\.github/|backend/uv\.lock$)' <<<"$changed"; then
            infra=true
          fi
          # docs/openapi.json: src/api/schema.d.ts is generated from it.
          if grep -qE '^(frontend/|docs/openapi\.json$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            frontend=true
          fi
          if grep -qE '^(docs/(openapi\.json|api-breaking-changes\.txt)|\.github/(scripts/api-changes\.sh|actions/oasdiff/.*))$' <<<"$changed"; then
            api=true
          fi
          echo "backend=$backend" | tee -a "$GITHUB_OUTPUT"
          echo "infra=$infra" | tee -a "$GITHUB_OUTPUT"
          echo "frontend=$frontend" | tee -a "$GITHUB_OUTPUT"
          echo "api=$api" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check --output-format=github
      - run: uv run lint-imports

      # The local development setup: the root compose.yaml and the dev image it builds.
      - name: Dev compose file and image
        run: |
          docker compose -f ../compose.yaml config --quiet
          docker build --quiet --target dev . >/dev/null

  unit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      # Unit and contract tests (the docs/openapi.json snapshot among them).
      - run: uv run pytest -n auto

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: candlestack
          POSTGRES_PASSWORD: candlestack
          POSTGRES_DB: candlestack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username candlestack --dbname candlestack"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      # The tests create this database and migrate it (tests/integration/conftest.py).
      DATABASE_URL: postgresql+asyncpg://candlestack:candlestack@127.0.0.1:5432/candlestack_test
    defaults:
      run:
        working-directory: backend
    steps:
      # The merge commit and its first parent, the base branch, for diff-cover.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      # Unit and integration tests together, serially (the integration tests share one Redis
      # and one Postgres), measured against the coverage gate of pyproject.toml (95%, branches
      # included).
      - run: uv run pytest -m "not e2e and not slow" --cov --cov-report=xml

      # At least 90% of the lines a pull request changes are covered.
      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=HEAD^1 --fail-under=90

  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      E2E_PORT: 18000
      E2E_BASE_URL: http://127.0.0.1:18000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built here with a layer cache, then started by compose from the loaded image.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: candlestack-backend:e2e-${{ env.E2E_PORT }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend-e2e
          cache-to: type=gha,mode=max,scope=backend-e2e

      - uses: ./.github/actions/trivy

      # Fails on a HIGH or CRITICAL vulnerability that has a fix, except the ones
      # .trivyignore.yaml accepts until a date.
      - name: Scan the image
        working-directory: .
        run: >-
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile .trivyignore.yaml --exit-code 1 candlestack-backend:e2e-${{ env.E2E_PORT }}

      # The worker that runs the models: the stage `worker` of the same Dockerfile, built and
      # scanned like the backend's image (its tests run in `unit` and `integration`).
      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: worker
          load: true
          tags: candlestack-worker:e2e
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=worker-e2e
          cache-to: type=gha,mode=max,scope=worker-e2e

      - name: Scan the worker image
        working-directory: .
        run: >-
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile .trivyignore.yaml --exit-code 1 candlestack-worker:e2e

      - name: Start the stack
        run: docker compose -f tests/e2e/compose.yaml up -d --wait

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run pytest -m e2e

      - name: Logs of the stack
        if: failure()
        run: docker compose -f tests/e2e/compose.yaml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f tests/e2e/compose.yaml down --volumes

  # The frontend app: oxlint, Prettier and knip, the unit tests, the type-checked build, and the
  # API types in sync with the contract. Its image is built and scanned in `infra`.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node release line of the image's build stage (frontend/Dockerfile).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # src/api/schema.d.ts is generated from docs/openapi.json and committed: regenerated here,
      # it must come out the same.
      - name: API types in sync with docs/openapi.json
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts

  # Breaking changes to the API: the pull request's docs/openapi.json against the base branch's
  # (the unit tests keep the snapshot equal to the code). Every change goes to the job summary;
  # a breaking one fails unless docs/api-breaking-changes.txt accepts it.
  api:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The merge commit and its first parent, the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/oasdiff

      - name: Breaking changes
        run: |
          git show HEAD^1:docs/openapi.json >"$RUNNER_TEMP/base.json"
          .github/scripts/api-changes.sh "$RUNNER_TEMP/base.json" docs/openapi.json

  # What only the post-merge deploy would otherwise exercise: the deploy script the VM runs as a
  # forced command, the compose files, the edge and tunnel configuration, the server agent and
  # the images other than the backend's. A broken one on main breaks the next deploy. The
  # workflows (actionlint) and the shell scripts (shellcheck) are checked in the Pre-commit job.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The real script as sshd runs it for each key, with fake docker and git.
      - name: Deploy script tests
        run: infra/vm/test-candlestack-deploy.sh

      # With dummy values for the variables the deploy script sets.
      - name: Compose files
        run: |
          ENV_NAME=stage APP_VERSION=check BACKEND_IMAGE=backend FRONTEND_IMAGE=frontend \
            REDIS_MAXMEMORY=256mb REDIS_MEM_LIMIT=288m EDGE_NETWORK=edge \
            POSTGRES_PASSWORD=check \
            docker compose -f infra/env/compose.yaml config --quiet
          # The worker and its queue, as stage runs them.
          WORKER_IMAGE=worker ENV_NAME=stage APP_VERSION=check BACKEND_IMAGE=backend \
            FRONTEND_IMAGE=frontend REDIS_MAXMEMORY=256mb REDIS_MEM_LIMIT=288m EDGE_NETWORK=edge \
            POSTGRES_PASSWORD=check QUEUE_PASSWORD=check-queue-password \
            docker compose -f infra/env/compose.yaml --profile worker config --quiet
          docker compose -f infra/edge/compose.yaml config --quiet
          IMAGE=agent docker compose -f infra/agent/compose.yaml config --quiet

      # The job queue of infra/env/compose.yaml as stage runs it: healthy, and it refuses a
      # client without the password. Without one (QUEUE_PASSWORD empty) it answers anyone.
      - name: Job queue password
        env:
          WORKER_IMAGE: worker
          ENV_NAME: stage
          APP_VERSION: check
          BACKEND_IMAGE: backend
          FRONTEND_IMAGE: frontend
          REDIS_MAXMEMORY: 256mb
          REDIS_MEM_LIMIT: 288m
          EDGE_NETWORK: edge
          POSTGRES_PASSWORD: check
        run: |
          docker network create edge >/dev/null
          compose=(docker compose -p queue-check -f infra/env/compose.yaml --profile worker)
          # ping <expected answer> [password]: what redis-cli in the queue's container gets.
          ping() {
            local answer
            answer=$("${compose[@]}" exec -T queue env -u REDISCLI_AUTH \
              redis-cli --no-auth-warning ${2:+-a "$2"} ping 2>&1)
            if [[ $answer != *"$1"* ]]; then
              echo "::error::expected '$1', got '$answer'"
              return 1
            fi
            echo "ok    ${2:+with a password: }$answer"
          }
          QUEUE_PASSWORD=check-queue-password "${compose[@]}" up --detach --wait queue
          ping NOAUTH
          ping WRONGPASS wrong-password-0123
          ping PONG check-queue-password
          QUEUE_PASSWORD='' "${compose[@]}" up --detach --wait queue
          ping PONG
          "${compose[@]}" down

      # ruff at the backend's release (backend/uv.lock) with infra/agent/ruff.toml, then the
      # tests on the Python the agent image is built from.
      - name: Server agent lint and tests
        run: |
          version=$(sed -n '/^name = "ruff"$/{n;s/^version = "\(.*\)"$/\1/p;}' backend/uv.lock)
          [[ -n $version ]] || { echo "::error::No ruff in backend/uv.lock"; exit 1; }
          ruff=(docker run --rm -v "$PWD/infra/agent:/io" "ghcr.io/astral-sh/ruff:$version")
          "${ruff[@]}" check --no-cache --output-format=github .
          "${ruff[@]}" format --no-cache --check .
          docker run --rm -v "$PWD/infra/agent:/agent:ro" -w /agent -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.13-alpine python -m unittest -v

      # With the Caddy image the edge runs.
      - name: Edge Caddyfile
        run: |
          image=$(sed -n 's/^ *image: *//p' infra/edge/compose.yaml)
          docker run --rm -v "$PWD/infra/edge/caddy:/etc/caddy:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Tunnel ingress rules
        run: |
          docker run --rm -v "$PWD/infra/cloudflared:/etc/cloudflared:ro" \
            cloudflare/cloudflared:2026.9.3 tunnel --config /etc/cloudflared/config.yml ingress validate

      - name: Frontend image and its Caddyfile
        run: |
          docker build --tag frontend-check frontend
          docker run --rm frontend-check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Server agent image
        run: docker build --tag agent-check infra/agent

      - uses: ./.github/actions/trivy

      # As the backend image in the e2e job: fails on a fixable HIGH or CRITICAL vulnerability.
      - name: Scan the frontend and agent images
        run: |
          for image in frontend-check agent-check; do
            trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml --exit-code 1 "$image"
          done

  # The one required check besides no-ai-signs, linked-issue and pr-hygiene: green when every
  # job passed or was skipped. Without those three, so that an edit fixing the pull request's
  # text leaves it green.
  ci:
    name: ci
    if: always()
    needs: [pre-commit, changes, lint, unit, integration, e2e, frontend, api, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
