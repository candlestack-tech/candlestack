name: Release

# A v* tag on a commit of main promotes the backend and frontend images that stage ran for
# that commit to prod (app.candlestack.tech). Nothing is rebuilt. The VM picks the images from
# its record of stage deploys, which only the stage key writes, not from a registry tag that any
# workflow allowed to write packages could move (see infra/vm/candlestack-deploy). The
# production environment requires the tech lead's approval before the deploy starts. The images
# get the version tag in the registry only after prod runs them; the job that deploys, and the
# token it gives the VM, can only read packages.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  no-ai-signs:
    uses: candlestack-tech/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  deploy:
    needs: no-ai-signs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.candlestack.tech
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.deploy.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails, before anything changes, when stage has not run the tagged commit.
      - name: Deploy prod
        id: deploy
        uses: ./.github/actions/deploy
        with:
          command: up prod ${{ github.ref_name }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          env-secrets: |
            ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID }}
            ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
            LOGO_DEV_KEY=${{ secrets.LOGO_DEV_KEY }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            OAUTH_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
            OAUTH_GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
            OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
            OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
            BETA_ALLOWLIST=${{ secrets.BETA_ALLOWLIST }}
            QUEUE_PASSWORD=${{ secrets.QUEUE_PASSWORD }}
          health-url: https://app.candlestack.tech/api/health
          health-expect: '"version":"${{ github.ref_name }}"'

      # prod is public: no Access token, so this also checks that anyone can reach it.
      - name: Smoke test
        run: .github/scripts/smoke.sh https://app.candlestack.tech

      # Links the release to its commits in Sentry. Informational: a Sentry outage must not fail
      # a deploy that is already live and checked.
      - name: Record the release in Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: .github/scripts/sentry-release.sh "$GITHUB_REF_NAME" prod

  # The only job that writes packages: it has no environment secrets and talks to no server.
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the deployed images with the version
        env:
          IMAGES: ${{ needs.deploy.outputs.images }}
        run: |
          # The worker's image is the third when the deploy started the worker.
          read -r backend frontend worker _ <<<"$IMAGES"
          if [[ -z $backend || -z $frontend ]]; then
            echo "::error::The deploy reported no images: '$IMAGES'"
            exit 1
          fi
          for image in "$backend" "$frontend" ${worker:+"$worker"}; do
            docker buildx imagetools create --tag "${image%@*}:$GITHUB_REF_NAME" "$image"
          done
