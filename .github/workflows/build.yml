name: Build image

on:
  workflow_call:
    inputs:
      name:
        description: Image name under ghcr.io/candlestack-tech/candlestack/
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      target:
        description: Stage of the Dockerfile to build; empty builds the last one
        required: false
        type: string
        default: ''
      tag:
        description: Image tag to push
        required: true
        type: string
      commit:
        description: Commit shown by the app
        required: true
        type: string
    outputs:
      image:
        description: Pushed image as name@digest
        value: ${{ jobs.build.outputs.image }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    env:
      IMAGE: ghcr.io/candlestack-tech/candlestack/${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: APP_COMMIT=${{ inputs.commit }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}

      - id: ref
        run: echo "image=$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
