name: Security scan

# Once a week, the images that run on the VM are scanned for vulnerabilities again: new ones are
# found after an image was built. Ours as prod (the latest release tag) and stage (main) run
# them, and the ones the compose files pin (edge Caddy, Redis, the
# agent's Docker proxy). Every fixable HIGH or CRITICAL finding, the ones .trivyignore.yaml
# accepts for CI included, goes to the Security tab of the repository as a code scanning alert;
# the run itself passes.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # list: [{"name": <alert category>, "ref": <image>}, ...]
      - id: list
        run: |
          registry=ghcr.io/candlestack-tech/candlestack
          release=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          stage=sha-$(git rev-parse HEAD)
          list=$(
            {
              echo "backend-prod $registry/backend:$release"
              echo "frontend-prod $registry/frontend:$release"
              echo "worker-prod $registry/worker:$release"
              echo "backend-stage $registry/backend:$stage"
              echo "frontend-stage $registry/frontend:$stage"
              echo "worker-stage $registry/worker:$stage"
              echo "agent $registry/agent:$stage"
              # The images the compose files name directly, e.g. "image: redis:8-alpine@sha256:...".
              sed -n 's/^ *image: *\([^$ ]*\)$/\1/p' infra/*/compose.yaml |
                while read -r image; do
                  name=${image%%[:@]*}
                  echo "${name##*/} $image"
                done
            } | jq -Rnc '[inputs | split(" ") | {name: .[0], ref: .[1]}]'
          )
          echo "$list" | jq .
          echo "list=$list" >>"$GITHUB_OUTPUT"

  scan:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/trivy

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image.ref }}
        env:
          IMAGE: ${{ matrix.image.ref }}
        run: >-
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --format sarif --output trivy.sarif "$IMAGE"

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: image-${{ matrix.image.name }}
