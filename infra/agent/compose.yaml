# Server agent: host metrics and containers for ops.candlestack.tech, served at
# vm.candlestack.tech/api/snapshot (behind Cloudflare Access). The page and its history
# live in the ops Worker: github.com/candlestack-tech/ops.
# Deployed from main by infra/vm/candlestack-deploy ("agent <image@digest>").
name: agent

services:
  agent:
    image: ${IMAGE:?}
    restart: unless-stopped
    environment:
      DOCKER_URL: http://socket-proxy:2375
      VM_LABEL: AWS t3.medium · eu-north-1
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        aliases:
          - vm-agent
      docker: {}

  # Read-only view of the Docker API: container list and stats, nothing else.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    networks:
      - docker

networks:
  edge:
    external: true
  docker:
    internal: true
