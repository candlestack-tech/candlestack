# One environment (prod or stage) as its own compose project, started by
# infra/vm/candlestack-deploy on the VM, which also exports the backend's Alpaca keys
# (ALPACA_KEY_ID, ALPACA_SECRET_KEY), the logo.dev key (LOGO_DEV_KEY), SENTRY_DSN, the Postgres
# password (POSTGRES_PASSWORD), the OAuth apps (OAUTH_GITHUB_CLIENT_ID,
# OAUTH_GITHUB_CLIENT_SECRET, OAUTH_GOOGLE_CLIENT_ID, OAUTH_GOOGLE_CLIENT_SECRET), the beta
# list (BETA_ALLOWLIST) and the job queue's password (QUEUE_PASSWORD) for this command only:
#   ENV_NAME=stage APP_VERSION=<version> BACKEND_IMAGE=<image@digest> FRONTEND_IMAGE=<image@digest> \
#   REDIS_MAXMEMORY=256mb REDIS_MEM_LIMIT=288m EDGE_NETWORK=edge POSTGRES_PASSWORD=<password> \
#   docker compose -p stage -f infra/env/compose.yaml up -d
# On the edge network (EDGE_NETWORK: "edge" for prod and stage) the edge Caddy reaches
# <ENV_NAME>-backend:8000 (/api/*) and <ENV_NAME>-frontend:8080 (everything else). Redis and
# Postgres are on the environment's own network only. Postgres keeps its data in the volume
# <ENV_NAME>_postgres; the migrate service brings it to the backend image's migrations before
# the backend starts, and the backup service dumps it every night into <ENV_NAME>_backups. The
# backend keeps the uploaded model files in the volume <ENV_NAME>_models, which the
# models-backup service archives every night into <ENV_NAME>_model_backups (infra/README.md,
# "Backups").
# The worker that runs the models and its job queue are in the profile "worker", in prod and
# stage. The deploy sets COMPOSE_PROFILES=worker and WORKER_IMAGE=<image@digest>, and they join the
# backend on the internal network <ENV_NAME>_jobs (infra/README.md, "Worker"). The queue
# requires QUEUE_PASSWORD, which the backend's and the worker's JOBS_REDIS_URL carry; without
# one (empty) it runs without a password.
services:
  backend:
    image: ${BACKEND_IMAGE:?}
    restart: unless-stopped
    environment:
      APP_ENV: ${ENV_NAME:?}
      APP_VERSION: ${APP_VERSION:?}
      REDIS_URL: redis://redis:6379/0
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      LOGO_DEV_KEY: ${LOGO_DEV_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: postgresql+asyncpg://candlestack:${POSTGRES_PASSWORD:?}@postgres:5432/candlestack
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      BETA_ALLOWLIST: ${BETA_ALLOWLIST:-}
      MODEL_STORAGE_DIR: /data/models
      JOBS_REDIS_URL: redis://:${QUEUE_PASSWORD:-}@queue:6379/0
      JOB_FILES_DIR: /data/jobs
    # Read by the server agent: ops tells deploys (new version) from redeploys (same version).
    labels:
      candlestack.version: ${APP_VERSION:?}
    # The app, and the child process that checks an upload (infra/README.md, "Memory").
    mem_limit: 384m
    read_only: true
    # The files of the uploaded models, and the jobs' files shared with the worker; the image's
    # /data/models and /data/jobs are owned by the app's user, so a new volume is too.
    volumes:
      - models:/data/models
      - jobs:/data/jobs
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 503 while Redis or Postgres is unreachable, so the container is unhealthy then too.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      default: {}
      jobs: {}
      edge:
        aliases:
          - ${ENV_NAME}-backend

  frontend:
    image: ${FRONTEND_IMAGE:?}
    restart: unless-stopped
    environment:
      APP_ENV: ${ENV_NAME:?}
      APP_VERSION: ${APP_VERSION:?}
    labels:
      candlestack.version: ${APP_VERSION:?}
    mem_limit: 32m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        aliases:
          - ${ENV_NAME}-frontend

  # Brings the database to the migrations of the backend image (alembic upgrade head), then
  # exits; the backend starts only after it succeeded, so a failing migration fails the deploy.
  migrate:
    image: ${BACKEND_IMAGE:?}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      APP_ENV: ${ENV_NAME:?}
      DATABASE_URL: postgresql+asyncpg://candlestack:${POSTGRES_PASSWORD:?}@postgres:5432/candlestack
    mem_limit: 160m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # The users' data, sized for a few connections (the backend's pool of at most 10, the
  # migration, the backup); the container limit leaves room for them above shared_buffers. Runs
  # as the image's postgres user, which owns the data volume, so it needs no capabilities.
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=96MB"]
    environment:
      POSTGRES_USER: candlestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: candlestack
    user: postgres
    mem_limit: 128m
    read_only: true
    volumes:
      - postgres:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "candlestack", "--dbname", "candlestack"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  # A pg_dump of the database every night at 00:00 UTC into the volume <ENV_NAME>_backups, the
  # last 7 days kept (infra/README.md, "Backups"). Root in the container, which owns the backup
  # volume, but without any capability.
  backup:
    image: prodrigestivill/postgres-backup-local:18-alpine@sha256:5519b121b9f3058dc6f116927f8131a6f67951542dbf2cdacfd193f42daaa7a3
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: candlestack
      POSTGRES_USER: candlestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "0"
      BACKUP_KEEP_MONTHS: "0"
    mem_limit: 32m
    read_only: true
    volumes:
      - backups:/backups
    # The image declares a volume for a database it does not run: a tmpfs keeps Docker from
    # leaving an anonymous volume there.
    tmpfs:
      - /tmp
      - /var/lib/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # A tar.gz of the uploaded model files every night at 00:30 UTC into the volume
  # <ENV_NAME>_model_backups, the last 7 days kept (infra/README.md, "Backups"). The models
  # volume is mounted read-only. The archive is built in /tmp (fixed by the image) before it is
  # copied: a volume there, as a tmpfs would hold every model file in memory. Root in the
  # container, which owns its volumes and reads the app's world-readable files, without any
  # capability.
  models-backup:
    image: offen/docker-volume-backup:v2.49.2@sha256:6630d1f122f42ada84566550e47647d2e7488ac3775176ee654b64e489ab6e40
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "30 0 * * *"
      BACKUP_FILENAME: models-%Y-%m-%dT%H-%M-%S.{{ .Extension }}
      BACKUP_PRUNING_PREFIX: models-
      BACKUP_RETENTION_DAYS: "7"
      # Uploads in progress: never whole, and removed when the backend starts.
      BACKUP_EXCLUDE_REGEXP: '/\.incoming/'
    # Enough to archive 300 MB of files (measured).
    mem_limit: 32m
    read_only: true
    volumes:
      - models:/backup/models:ro
      - model_backups:/archive
      - model_backups_work:/tmp
    tmpfs:
      - /var/lock
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # It reaches nothing: the archives stay on the VM.
    network_mode: none

  # Runs the models users upload, one job at a time, each in a process of its own with a time
  # limit (docs/architecture.md, "Worker"). On the internal jobs network only: it reaches the
  # queue and nothing else, no internet. The model files read-only, the jobs' files shared with
  # the backend; the image's /data/jobs is owned by its user (65534), as the backend's is.
  # No SENTRY_DSN: without network it could not reach Sentry. A bug of the worker reaches
  # Sentry through the backend, which logs the job's `internal` result as an error.
  # Started as root with only the capabilities to change its user (and the init, which stays
  # root): the loop reads the queue's password, then becomes 65534 for good, so the job's
  # process can read it neither in its environment nor in the loop's or the init's
  # (docs/architecture.md, "Worker").
  worker:
    image: ${WORKER_IMAGE:-}
    profiles: [worker]
    restart: unless-stopped
    user: "0:0"
    environment:
      APP_ENV: ${ENV_NAME:?}
      APP_VERSION: ${APP_VERSION:?}
      JOBS_REDIS_URL: redis://:${QUEUE_PASSWORD:-}@queue:6379/0
      MODEL_STORAGE_DIR: /data/models
      JOB_FILES_DIR: /data/jobs
    labels:
      candlestack.version: ${APP_VERSION:?}
    # The loop (about 85 MB) and one job's process: Keras with JAX and the model, about 300 MB
    # for 50000 candles of the raw-candles test model, 500 MB for 50000 candles of a 25 x 28
    # model, which builds its input in parts (infra/README.md, "Memory"). No swap: a model over the limit fails its job at once
    # instead of slowing the VM down. One of the two vCPUs, so a model cannot starve the
    # backend. At most 512 processes and threads (a job's XLA thread pools grow with the CPUs:
    # 183 at its peak on 20), and an init that reaps what a job's process left.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 512
    init: true
    read_only: true
    volumes:
      - models:/data/models:ro
      - jobs:/data/jobs
    # Keras' settings and the copy of the model it loads (a file of at most 50 MB).
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      queue:
        condition: service_healthy
    networks:
      - jobs

  # The job queue between the backend and the worker: a Redis of its own, so the worker reaches
  # none of the cache's keys. It never evicts (a job must not vanish) and keeps nothing on disk:
  # a job lost with it ends as a timeout at the backend. It refuses every command but AUTH
  # without QUEUE_PASSWORD (an empty one is none); redis-cli of the health check sends it.
  queue:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    profiles: [worker]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "16mb", "--maxmemory-policy", "noeviction", "--requirepass", "${QUEUE_PASSWORD:-}"]
    environment:
      REDISCLI_AUTH: ${QUEUE_PASSWORD:-}
    user: redis
    mem_limit: 32m
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # redis-cli exits 0 on a refusal too (NOAUTH): only PONG is healthy.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jobs

  # Cache only: no persistence, least recently used keys go first when maxmemory is reached.
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:?}", "--maxmemory-policy", "allkeys-lru"]
    user: redis
    mem_limit: ${REDIS_MEM_LIMIT:?}
    read_only: true
    # Nothing is written to /data; a tmpfs there keeps Docker from leaving an anonymous volume.
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

volumes:
  postgres: {}
  backups: {}
  models: {}
  model_backups: {}
  model_backups_work: {}
  # The jobs' files: in memory and at most 64 MB (a predict of 50000 candles has about 2 MB of
  # candles and 0.5 MB of predictions), so nothing a job writes can fill the VM's disk, which
  # prod shares. Owned by the backend's and the worker's user (65534).
  jobs:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,uid=65534,gid=65534,mode=0700

networks:
  # The backend, the worker and its queue: internal, so the worker has no way out.
  jobs:
    internal: true
  # Without EDGE_NETWORK compose fails, rather than start the environment on a network the
  # deploy script did not choose.
  edge:
    name: ${EDGE_NETWORK:?}
    external: true
