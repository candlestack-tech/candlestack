# Findings the image scan in CI accepts for a while, each with the date to look again: after it
# the scan fails on the finding. The weekly scan (security-scan.yml) reports them anyway.
vulnerabilities:
  # The Caddy binary of the frontend image. The newest official caddy:2 image (2.11.4) is built
  # with Go 1.26.3 and older golang.org/x and gRPC modules; a Caddy release built with newer ones
  # fixes them, and frontend/Dockerfile follows caddy:2. The frontend only serves static files
  # behind the edge.
  - id: CVE-2026-27145
    paths: [usr/bin/caddy]
