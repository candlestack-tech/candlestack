# Findings the image scan in CI accepts for a while, each with the date to look again: after it
# the scan fails on the finding. The weekly scan (security-scan.yml) reports them anyway.
vulnerabilities:
  # The Caddy binary of the frontend image. The newest official caddy:2 image (2.11.9) is built
  # with golang.org/x/net 0.60.0; x/net 0.62.0 fixes this, and frontend/Dockerfile follows caddy:2.
  # The frontend only serves static files behind the edge.
  - id: CVE-2026-78661
    paths: [usr/bin/caddy]
    expired_at: 2026-11-21
